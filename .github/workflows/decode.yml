name: decode
on:
  push:
    paths: ['b64/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          base64 -d b64/assets.tgz.b64 | tar xz
          git rm -rq b64
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -A
          git diff --cached --quiet || (git commit -m 'decode assets' && git push)
          git push origin HEAD:gh-pages --force
